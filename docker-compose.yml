services:
  gateway:
    build: ./gateway
    container_name: gateway
    hostname: gateway
    ports:
      - "8080:3000"
    environment:
      - PORT=3000
      - REPORTES_URL=http://reportes:8001
      - AUDITORIA_URL=http://auditoria:8002
    depends_on:
      reportes:
        condition: service_started
      auditoria:
        condition: service_started
    networks:
      frontend_net:
        ipv4_address: 172.20.0.10
      backend_net:
        ipv4_address: 172.21.0.10

  reportes:
    build: ./reportes
    container_name: reportes
    hostname: reportes
    expose:
      - "8001"
    environment:
      - DATABASE_URL=postgresql://reportau_user:reportau_pass@postgres:5432/reportau_db
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      backend_net:
        ipv4_address: 172.21.0.11

  auditoria:
    build: ./auditoria
    container_name: auditoria
    hostname: auditoria
    expose:
      - "8002"
    environment:
      - MONGO_URI=mongodb://mongo:27017
      - MONGO_DB=reportau_audit
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      backend_net:
        ipv4_address: 172.21.0.12

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    hostname: postgres
    expose:
      - "5432"
    environment:
      - POSTGRES_USER=reportau_user
      - POSTGRES_PASSWORD=reportau_pass
      - POSTGRES_DB=reportau_db
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reportau_user -d reportau_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      backend_net:
        ipv4_address: 172.21.0.20

  mongo:
    image: mongo:7
    container_name: mongo
    hostname: mongo
    expose:
      - "27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      backend_net:
        ipv4_address: 172.21.0.21

networks:
  frontend_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24
  backend_net:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.21.0.0/24

volumes:
  pg_data:
  mongo_data:
