[package]
name = "auditoria"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
mongodb = "2.8"
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
